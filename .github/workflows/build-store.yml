# Shim: registers the workflow and its Run-workflow form on the default
# branch. The real workflow lives on the mobile branch — GitHub executes the
# file from the ref picked in the Run-workflow dropdown, so select 'mobile'
# (or a mobile release tag) there. Keep name/triggers/inputs in sync with
# the mobile branch's copy.
name: Build Mobile Store Releases

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build/submit profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      build_ios:
        description: Build iOS
        required: true
        default: true
        type: boolean
      build_android:
        description: Build Android
        required: true
        default: true
        type: boolean
      publish:
        description: Publish after a successful build (production profile only — preview artifacts are not store-submittable)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  wrong-ref:
    name: Wrong ref — run this on mobile
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This ref only carries a shim of the workflow."
          echo "Re-run and pick 'mobile' (or a mobile release tag) in the Run workflow ref dropdown."
          exit 1
